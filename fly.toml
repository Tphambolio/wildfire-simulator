app = "firesim-api"
primary_region = "yyz"

[build]
  dockerfile = "api/Dockerfile"
  build_context = "."

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  strategy = "immediate"

[env]
  # Set FIRESIM_CORS_ORIGINS to your Vercel URL after first deploy, e.g.:
  # FIRESIM_CORS_ORIGINS = "https://wildfire-simulator.vercel.app"
  FIRESIM_CORS_ORIGINS = "https://wildfire-simulator.vercel.app"
  FIRESIM_NEIGHBOURHOODS_PATH = "/app/data/edmonton_neighbourhoods.geojson"
  # Run archive size cap on the 1 GB volume (oldest runs dropped first)
  FIRESIM_ARCHIVE_MAX_BYTES = "800000000"
  # One ensemble computes at a time on the single shared CPU; others wait as "pending"
  FIRESIM_MAX_CONCURRENT_ENSEMBLES = "1"

# Run archive (docs/run-archive.md): a 1 GB volume (about $0.15/month), created 2026-10-12 with
# fly volumes create firesim_archive --app firesim-api --region yyz --size 1. The archive finds
# /data and keeps the index and payloads in /data/firesim-archive; capped at 800 MB (FIRESIM_ARCHIVE_MAX_BYTES above).
[mounts]
  source = "firesim_archive"
  destination = "/data"
