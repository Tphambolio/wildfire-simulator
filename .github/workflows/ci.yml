name: CI

on:
  push:
    branches: [master]
  pull_request:
    # feat/** too, so stacked PRs (base = another feature branch) get CI
    branches: [master, "feat/**"]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install engine and API
        run: |
          pip install engine/
          pip install "api/[dev]"

      - name: Test engine
        run: PYTHONPATH=engine/src python -m pytest engine/tests/ -v --tb=short

      - name: Test API
        run: PYTHONPATH=engine/src:api/src python -m pytest api/tests/ -v --tb=short

      - name: Check no empty test files
        run: |
          for f in $(find . -name "test_*.py" -path "*/tests/*"); do
            # Match def test_ and async def test_, any indent level
            count=$(grep -cE "^\s*(async\s+)?def test_" "$f" || true)
            if [ "$count" -eq 0 ]; then
              echo "ERROR: Empty test file: $f"
              exit 1
            fi
          done
          echo "All test files contain at least one test function."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and check
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test

  # Not a required check: Playwright e2e against `vite preview` with the mocked API
  # (frontend/tests/e2e/mockApi.ts) replaying the recorded fixture run.
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  deploy:
    needs: [engine-tests, frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
