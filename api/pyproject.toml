[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firesim-api"
version = "3.0.0"
description = "FastAPI backend for wildfire spread simulation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "Pillow>=10.0.0",
    # IANA 2026c+: Alberta on UTC-6 all year from 2026-11-01 (services/alberta_time.py). The API
    # image reads it instead of the OS zone files (api/Dockerfile PYTHONTZPATH).
    "tzdata>=2026.3",
    "firesim",
]

[project.optional-dependencies]
# Run archive on an S3-compatible store (Cloudflare R2); the local backend needs nothing
archive-s3 = ["boto3>=1.28"]
dev = [
    "pytest>=7.4",
    "httpx>=0.25.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
